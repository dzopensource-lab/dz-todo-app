<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZ Todo App — Oussama Boudinar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📝 DZ Todo</h1>
      <p class="subtitle">A simple task manager · Built with vanilla JavaScript</p>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="stats">
      <span id="stats-text">0 tasks</span>
      <button id="clear-completed">Clear completed</button>
    </div>
  </div>

  <footer>
    <p>© 2026 Oussama Boudinar · <a href="https://github.com/dzopensource-lab">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
